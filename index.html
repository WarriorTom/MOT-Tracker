<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warrior Logistics — MOT Tracker</title>
<style>
:root{--red:#cc0000;--red2:#a90000;--black:#0b0b0b;--panel:#151515;--panel2:#1c1c1c;--line:#2c2c2c;--text:#f4f4f4;--muted:#a9a9a9;--green:#25c26e;--amber:#f2b84b;--orange:#ff8c42;--danger:#ff4d4d}
*{box-sizing:border-box}
body{margin:0;background:#090909;color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}
header{background:linear-gradient(135deg,#050505,#171717);border-bottom:1px solid #2a2a2a;padding:22px 28px;display:flex;justify-content:space-between;align-items:center;gap:20px;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:14px}.logo{width:44px;height:44px;background:var(--red);border-radius:10px;display:grid;place-items:center;font-weight:900;font-size:20px;box-shadow:0 0 25px #cc000033}.brand h1{margin:0;font-size:21px}.brand span{font-size:12px;color:var(--muted)}
button{border:0;border-radius:9px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:var(--red);color:white}.primary:hover{background:#e00000}.secondary{background:#252525;color:white}
main{max-width:1300px;margin:auto;padding:28px}
.hero{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:25px}.hero h2{font-size:30px;margin:0 0 5px}.hero p{margin:0;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:22px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}.card .label{color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}.card .num{font-size:30px;font-weight:900;margin-top:7px}.red{border-top:3px solid var(--danger)}.orange{border-top:3px solid var(--orange)}.amber{border-top:3px solid var(--amber)}.green{border-top:3px solid var(--green)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;background:var(--panel);padding:14px;border:1px solid var(--line);border-radius:14px;margin-bottom:14px}.search{flex:1;min-width:220px}.toolbar input,.toolbar select{background:#0d0d0d;color:white;border:1px solid #333;border-radius:9px;padding:11px 12px;outline:none}.toolbar input:focus,.toolbar select:focus{border-color:var(--red)}
.tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:800px}th{background:#101010;color:#aaa;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:14px}td{padding:14px;border-top:1px solid var(--line);font-size:14px}tr:hover td{background:#191919}.reg{font-weight:900;letter-spacing:.06em}.status{display:inline-flex;align-items:center;gap:7px;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:900}.status.ok{background:#123522;color:#66e69a}.status.amber{background:#3b2f12;color:#ffd36a}.status.orange{background:#3b2112;color:#ffad76}.status.overdue{background:#3b1212;color:#ff7777}.days{font-weight:900}.actions button{padding:7px 9px;font-size:11px;margin-right:5px}
.empty{text-align:center;padding:50px;color:var(--muted)}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.show{display:flex}.modalbox{width:100%;max-width:460px;background:#171717;border:1px solid #333;border-radius:16px;padding:22px;box-shadow:0 25px 80px #000}.modalbox h3{margin-top:0}.field{margin-bottom:14px}.field label{display:block;font-size:12px;color:#aaa;margin-bottom:6px}.field input{width:100%;padding:12px;background:#0b0b0b;border:1px solid #333;color:#fff;border-radius:9px}.modalactions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.hero{align-items:start;flex-direction:column}}
@media(max-width:520px){main{padding:16px}.cards{grid-template-columns:1fr 1fr}.card .num{font-size:24px}header{padding:16px}.brand h1{font-size:17px}}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="logo">W</div><div><h1>WARRIOR LOGISTICS</h1><span>Fleet Management • MOT Tracker</span></div></div>
  <button class="primary" onclick="openAdd()">+ Add Van</button>
</header>
<main>
  <section class="hero">
    <div><h2>MOT Tracker</h2><p>Monitor every vehicle's MOT expiry at a glance.</p></div>
    <button class="secondary" onclick="exportCSV()">Export CSV</button>
  </section>

  <section class="cards">
    <div class="card"><div class="label">Total Vans</div><div class="num" id="total">0</div></div>
    <div class="card red"><div class="label">Overdue</div><div class="num" id="overdue">0</div></div>
    <div class="card orange"><div class="label">Due ≤ 7 Days</div><div class="num" id="seven">0</div></div>
    <div class="card amber"><div class="label">Due ≤ 30 Days</div><div class="num" id="thirty">0</div></div>
    <div class="card green"><div class="label">OK</div><div class="num" id="ok">0</div></div>
  </section>

  <section class="toolbar">
    <input class="search" id="search" placeholder="Search van number or registration..." oninput="render()">
    <select id="filter" onchange="render()">
      <option value="all">All statuses</option>
      <option value="overdue">Overdue</option>
      <option value="7">Due within 7 days</option>
      <option value="30">Due within 30 days</option>
      <option value="ok">OK</option>
    </select>
  </section>

  <section class="tablewrap">
    <table>
      <thead><tr><th>Van Number</th><th>Registration</th><th>MOT Due Date</th><th>Days Remaining</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="empty" style="display:none">No vans match your search.</div>
  </section>
</main>

<div class="modal" id="modal">
 <div class="modalbox">
  <h3 id="modalTitle">Add Van</h3>
  <div class="field"><label>VAN NUMBER</label><input id="vanInput"></div>
  <div class="field"><label>VAN REG</label><input id="regInput"></div>
  <div class="field"><label>MOT DUE DATE</label><input id="dateInput" type="date"></div>
  <div class="modalactions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="saveVan()">Save Van</button></div>
 </div>
</div>

<script>
const initialData = [{"van": "2", "reg": "LC71 ODU", "due": "2027-08-26"}, {"van": "3", "reg": "LD71 UMC", "due": "2026-11-05"}, {"van": "4", "reg": "LD71 UPM", "due": "2026-11-25"}, {"van": "5", "reg": "LD71 ZWT", "due": "2026-10-24"}, {"van": "6", "reg": "LD71 OVL", "due": "2026-11-10"}, {"van": "7", "reg": "LD71 MHF", "due": "2026-11-12"}, {"van": "8", "reg": "LD71 AXK", "due": "2026-12-30"}, {"van": "9", "reg": "LC71 KNP", "due": "2026-10-28"}, {"van": "10", "reg": "LD71 MDF", "due": "2027-02-26"}, {"van": "11", "reg": "LD71 DVR", "due": "2027-02-15"}, {"van": "12", "reg": "KW24 TWM", "due": "2027-07-04"}, {"van": "13", "reg": "KW24 HKK", "due": "2027-07-04"}, {"van": "14", "reg": "KW24 GNU", "due": "2027-07-04"}];
const STORAGE_KEY = "warrior_mot_tracker_v1";
let vans = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null") || initialData;
let editIndex = -1;

function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(vans)); }

function daysTo(dateStr){
  if(!dateStr) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const due = new Date(dateStr+"T00:00:00");
  return Math.round((due-today)/86400000);
}
function info(d){
  if(d === null) return ["","", "no-date"];
  if(d < 0) return [d,"OVERDUE","overdue"];
  if(d <= 7) return [d,"DUE WITHIN 7 DAYS","orange"];
  if(d <= 30) return [d,"DUE WITHIN 30 DAYS","amber"];
  return [d,"OK","ok"];
}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function render(){
  const q=document.getElementById("search").value.toLowerCase().trim();
  const f=document.getElementById("filter").value;
  let counts={total:vans.length,overdue:0,seven:0,thirty:0,ok:0};
  vans.forEach(v=>{const [d,,c]=info(daysTo(v.due)); if(c==="overdue")counts.overdue++; else if(c==="orange")counts.seven++; else if(c==="amber")counts.thirty++; else if(c==="ok")counts.ok++;});
  for(const k of Object.keys(counts)) document.getElementById(k).textContent=counts[k];
  const rows=vans.map((v,i)=>({v,i,d:daysTo(v.due),x:info(daysTo(v.due))}))
    .filter(o=>!q || o.v.van.toLowerCase().includes(q)||o.v.reg.toLowerCase().includes(q))
    .filter(o=>f==="all" || (f==="overdue"&&o.x[2]==="overdue") || (f==="7"&&o.x[2]==="orange") || (f==="30"&&["orange","amber"].includes(o.x[2])) || (f==="ok"&&o.x[2]==="ok"));
  const tb=document.getElementById("tbody"); tb.innerHTML="";
  rows.sort((a,b)=>(a.d??999999)-(b.d??999999)).forEach(o=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`<td>${esc(o.v.van)}</td><td class="reg">${esc(o.v.reg)}</td><td>${o.v.due?new Date(o.v.due+"T00:00:00").toLocaleDateString("en-GB"):"—"}</td><td class="days">${o.d===null?"—":o.d+" days"}</td><td><span class="status ${o.x[2]}">${o.x[1]||"NO DATE"}</span></td><td class="actions"><button class="secondary" onclick="openEdit(${o.i})">Edit</button><button class="secondary" onclick="removeVan(${o.i})">Delete</button></td>`;
    tb.appendChild(tr);
  });
  document.getElementById("empty").style.display=rows.length?"none":"block";
}
function openAdd(){editIndex=-1;document.getElementById("modalTitle").textContent="Add Van";vanInput.value="";regInput.value="";dateInput.value="";modal.classList.add("show");}
function openEdit(i){editIndex=i;const v=vans[i];document.getElementById("modalTitle").textContent="Edit Van";vanInput.value=v.van;regInput.value=v.reg;dateInput.value=v.due;modal.classList.add("show");}
function closeModal(){modal.classList.remove("show");}
function saveVan(){
  const v={van:vanInput.value.trim(),reg:regInput.value.trim().toUpperCase(),due:dateInput.value};
  if(!v.van||!v.reg||!v.due){alert("Please complete all fields.");return;}
  if(editIndex===-1)vans.push(v);else vans[editIndex]=v;
  save();closeModal();render();
}
function removeVan(i){if(confirm("Delete this van from the tracker?")){vans.splice(i,1);save();render();}}
function exportCSV(){
  const rows=[["VAN NUMBER","VAN REG","MOT DUE DATE","DAYS TO MOT","STATUS"],...vans.map(v=>{const d=daysTo(v.due),x=info(d);return[v.van,v.reg,v.due,d??"",x[1]||"NO DATE"]})];
  const csv=rows.map(r=>r.map(x=>`"${String(x).replaceAll('"','""')}"`).join(",")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="Warrior_MOT_Tracker.csv";a.click();
}
render();
</script>
</body>
</html>
